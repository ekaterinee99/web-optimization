<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>სურათების გალერეა</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>სურათების გალერეა</h1>
    <section class="gallery" aria-label="სურათები">
      <img id="galleryImage" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900" alt="ბუნების სურათი">
    </section>
    <div class="buttons">
      <button id="toggleButton">დამალვა</button>
      <button id="changeButton">სურათის შეცვლა</button>
    </div>
    <label for="imageUrl">ახალი სურათის URL:</label>
    <input id="imageUrl" type="url" placeholder="ჩასვი სურათის URL">
    <p id="message" aria-live="polite"></p>
  </main>
</body>
</html>
